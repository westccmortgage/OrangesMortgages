name: Normalize Orange Mortgage entity consistency

on:
  push:
    paths:
      - '.github/workflows/fix-wccm-entity-consistency-20260909.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/sleepy-sagan-43ahoe
      - name: Normalize founder experience and WCCM entity references
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = [
              ('Mortgage professional since 2001', 'Mortgage and real estate professional since 2004'),
              ('Mortgage professional since 2004', 'Mortgage and real estate professional since 2004'),
              ('mortgage professional since 2001', 'mortgage and real estate professional since 2004'),
              ('mortgage professional since 2004', 'mortgage and real estate professional since 2004'),
              ('Ипотечный специалист с 2001 года', 'Специалист по ипотеке и недвижимости с 2004 года'),
              ('Ипотечный специалист с 2004 года', 'Специалист по ипотеке и недвижимости с 2004 года'),
              ('Profesional hipotecario desde 2001', 'Profesional de hipotecas y bienes raíces desde 2004'),
              ('Profesional hipotecario desde 2004', 'Profesional de hipotecas y bienes raíces desde 2004'),
              ('NMLS&nbsp;#2817729 · CA&nbsp;DRE&nbsp;#01385024', 'NMLS&nbsp;#2817729 · CA&nbsp;DRE&nbsp;Corp.&nbsp;License&nbsp;#02440065'),
              ('West Coast Capital Mortgage, Inc. — NMLS #2817729, California DRE #01385024.', 'West Coast Capital Mortgage, Inc. — NMLS #2817729, CA DRE Corporation License #02440065.'),
              ('https://westccmortgage.com', 'https://westcoastcapitalmortgage.com'),
              ('>westccmortgage.com<', '>westcoastcapitalmortgage.com<'),
          ]

          changed=[]
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git/' in str(p) or p.suffix.lower() not in {'.html','.js','.md','.txt','.xml','.toml'}:
                  continue
              try:
                  s=p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              old=s
              for a,b in replacements:
                  s=s.replace(a,b)
              if s != old:
                  p.write_text(s,encoding='utf-8')
                  changed.append(str(p))

          print('Changed files:')
          print('\n'.join(changed) if changed else '(none)')
          PY
      - name: Validate corrections
        run: |
          ! grep -R -F 'Mortgage professional since 2001' . --exclude-dir=.git
          ! grep -R -F 'Mortgage professional since 2004' . --exclude-dir=.git
          ! grep -R -F 'Ипотечный специалист с 2001 года' . --exclude-dir=.git
          ! grep -R -F 'Profesional hipotecario desde 2001' . --exclude-dir=.git
          grep -R -F 'Mortgage and real estate professional since 2004' about.html js/i18n.js
          grep -F 'CA DRE Corporation License #02440065' about.html
          grep -F 'https://westcoastcapitalmortgage.com' about.html
      - name: Commit normalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No source changes needed"
          else
            git commit -m "Normalize WCCM founder entity references"
            git push origin HEAD:claude/sleepy-sagan-43ahoe
          fi
