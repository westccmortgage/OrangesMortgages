name: Normalize Anatoliy bio date

on:
  push:
    branches:
      - 'claude/sleepy-sagan-43ahoe'
    paths:
      - '.github/workflows/fix-anatoliy-bio-20260908.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize public bio chronology
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          changed = []
          for p in Path('.').glob('*.html'):
              s = p.read_text()
              n = s.replace('Mortgage professional since 2001', 'Mortgage professional since 2004')
              n = n.replace('mortgage professional since 2001', 'mortgage professional since 2004')
              if n != s:
                  p.write_text(n)
                  changed.append(str(p))
          print('changed:', changed)
          assert changed, 'Expected at least one public bio date to update'
          for p in Path('.').glob('*.html'):
              s = p.read_text()
              assert 'Mortgage professional since 2001' not in s
              assert 'mortgage professional since 2001' not in s
          PY
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'AI Visibility Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add '*.html'
          git commit -m 'Normalize Anatoliy public bio to since 2004'
          git push
