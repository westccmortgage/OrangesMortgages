<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" role="img" aria-label="Orange the mortgage mascot">
  <defs>
    <radialGradient id="peel" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="55%" stop-color="#ff9a1f"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </radialGradient>
    <linearGradient id="leafg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5fb85f"/>
      <stop offset="100%" stop-color="#2f8f3a"/>
    </linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a6b"/>
      <stop offset="100%" stop-color="#14264a"/>
    </linearGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(20,38,74,0.18)"/>
      <stop offset="100%" stop-color="rgba(20,38,74,0)"/>
    </radialGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="200" cy="452" rx="120" ry="20" fill="url(#shadow)"/>

  <!-- legs -->
  <rect x="168" y="372" width="26" height="70" rx="13" fill="url(#suit)"/>
  <rect x="206" y="372" width="26" height="70" rx="13" fill="url(#suit)"/>
  <!-- shoes -->
  <ellipse cx="180" cy="448" rx="26" ry="12" fill="#7a431f"/>
  <ellipse cx="220" cy="448" rx="26" ry="12" fill="#7a431f"/>

  <!-- suit body / jacket -->
  <path d="M120 300 q80 -34 160 0 q22 8 22 40 v40 q0 18 -18 18 H116 q-18 0 -18 -18 v-40 q0 -32 22 -40 z" fill="url(#suit)"/>
  <!-- white shirt V -->
  <path d="M186 300 l14 30 l14 -30 q-14 -8 -28 0 z" fill="#f7f9fc"/>
  <!-- tie -->
  <path d="M200 318 l-9 12 l9 34 l9 -34 z" fill="#ff8a1f"/>
  <!-- lapels -->
  <path d="M170 302 l30 28 l-44 30 z" fill="#16294f"/>
  <path d="M230 302 l-30 28 l44 30 z" fill="#16294f"/>
  <!-- house lapel pin -->
  <path d="M236 350 l10 -9 l10 9 v13 h-20 z" fill="none" stroke="#ff8a1f" stroke-width="3" stroke-linejoin="round"/>

  <!-- left arm raised pointing -->
  <path d="M132 312 q-40 -10 -58 -54 q-6 -16 8 -22 q14 -6 22 10 q14 30 40 40 z" fill="url(#suit)"/>
  <circle cx="74" cy="246" r="17" fill="url(#peel)"/>
  <rect x="69" y="214" width="10" height="26" rx="5" fill="url(#peel)"/>

  <!-- right arm at side -->
  <path d="M280 314 q34 6 44 44 q5 16 -10 20 q-15 4 -20 -12 q-8 -28 -28 -34 z" fill="url(#suit)"/>
  <circle cx="324" cy="372" r="17" fill="url(#peel)"/>

  <!-- ====== ORANGE HEAD ====== -->
  <!-- leaf -->
  <path d="M214 44 q44 -30 78 -8 q-12 40 -58 40 q-20 0 -20 -32 z" fill="url(#leafg)"/>
  <path d="M222 50 q34 6 60 22" fill="none" stroke="#1f6e2a" stroke-width="3" stroke-linecap="round"/>
  <!-- stem -->
  <rect x="196" y="40" width="12" height="34" rx="6" fill="#3f7d2e"/>

  <circle cx="200" cy="180" r="118" fill="url(#peel)"/>
  <circle cx="200" cy="180" r="118" fill="none" stroke="#e96f00" stroke-width="2" opacity="0.5"/>

  <!-- eyebrows -->
  <path d="M150 128 q22 -16 44 -4" fill="none" stroke="#3a2412" stroke-width="9" stroke-linecap="round"/>
  <path d="M250 128 q-22 -16 -44 -4" fill="none" stroke="#3a2412" stroke-width="9" stroke-linecap="round"/>
  <!-- eyes -->
  <ellipse cx="166" cy="166" rx="26" ry="30" fill="#fff"/>
  <ellipse cx="234" cy="166" rx="26" ry="30" fill="#fff"/>
  <circle cx="170" cy="170" r="14" fill="#221a12"/>
  <circle cx="238" cy="170" r="14" fill="#221a12"/>
  <circle cx="175" cy="164" r="5" fill="#fff"/>
  <circle cx="243" cy="164" r="5" fill="#fff"/>
  <!-- smile -->
  <path d="M150 214 q50 56 100 0 q-50 26 -100 0 z" fill="#7a1f12"/>
  <path d="M150 214 q50 56 100 0" fill="none" stroke="#5a1409" stroke-width="3"/>
  <ellipse cx="200" cy="236" rx="16" ry="10" fill="#ff5b6e"/>
  <!-- cheeks -->
  <circle cx="138" cy="200" r="13" fill="#ff7a3d" opacity="0.45"/>
  <circle cx="262" cy="200" r="13" fill="#ff7a3d" opacity="0.45"/>
</svg>
