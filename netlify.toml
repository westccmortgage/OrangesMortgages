# Netlify configuration — Orange Mortgage
# This is a zero-build static site served straight from the repository root
# (index.html, css/, js/, assets/). There is no build step and no subdirectory.

[build]
  # Repository root is the base. An empty string resets any previously
  # configured (and invalid) base directory back to the repo root.
  base = ""
  # Publish the repo root, where index.html lives.
  publish = "."
  # No build/bundling step for a plain static site.
  command = ""

# Long-cache fingerprint-free static assets are fine to revalidate; the SVGs
# and favicon rarely change, so allow a long cache with revalidation.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Sensible baseline security headers for a public marketing site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The old California demo landing page is not part of the live site.
# force = true so the redirect wins over the existing files in /california-mortgage/.
[[redirects]]
  from = "/california-mortgage"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/california-mortgage/*"
  to = "/"
  status = 301
  force = true

# Clean URLs for the legal pages.
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

# Internal planning notes are not public pages
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true
