# Netlify configuration — Orange Mortgage
# Static site served from the repository root.

[build]
  base = ""
  publish = "."
  command = "node scripts/install-lead-fields.mjs"

# Long-cache fingerprint-free static assets are fine to revalidate; the SVGs
# and favicon rarely change, so allow a long cache with revalidation.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Sensible baseline security headers for a public marketing site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
